  var r=route();
  var items=[['home',IC.home,'nHome'],['explore',IC.explore,'nExplore'],['create',IC.plus,'nCreate'],['bookmarks',IC.bm,'nBm'],['profile',IC.user,'nProfile']];
  document.getElementById('nav').innerHTML='<ul>'+items.map(function(i){
    var mid=i[0]==='create';
    return '<li><a href="#'+i[0]+'" class="'+(mid?'mid':'')+'"'+(r===i[0]&&!UI.q?' aria-current="page"':'')+'>'+
      (mid?'<span class="pl">'+i[1]+'</span>':i[1])+'<span>'+esc(t(i[2]))+'</span></a></li>';}).join('')+'</ul>';
}
function renderChrome(){
  document.documentElement.lang=S.lang;
  document.getElementById('tagline').textContent=t('tagline');
  $q.placeholder=t('search');
  if(S.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme);
  renderNav();
}
function render(){
  var r=route(), html;
  if(UI.q.trim())html=vSearch();
  else if(r==='explore')html=vExplore();
  else if(r==='create')html=vCreate();
  else if(r==='bookmarks')html=vBookmarks();
  else if(r==='profile')html=vProfile();
  else html=vHome();
  $view.innerHTML=html;
  $clr.hidden=!UI.q;
  renderNav();
}
function go(h){if(location.hash==='#'+h)render();else location.hash=h;}

/* ---------- Events ---------- */
$q.addEventListener('input',function(){UI.q=$q.value;render();});
$clr.addEventListener('click',function(){UI.q='';$q.value='';render();$q.focus();});
window.addEventListener('hashchange',function(){UI.confirm=null;render();window.scrollTo(0,0);});
document.getElementById('themeBtn').addEventListener('click',function(){
  var order=['system','dark','light']; S.theme=order[(order.indexOf(S.theme)+1)%3]; save(); renderChrome(); render();
});

document.addEventListener('click',function(e){
  var a=e.target.closest('[data-open]');
  if(a){
    var rec={name:a.getAttribute('data-name'),url:a.getAttribute('data-url'),c:a.getAttribute('data-c'),m:a.getAttribute('data-m')};
    S.recent=[rec].concat(S.recent.filter(function(x){return x.url!==rec.url;})).slice(0,12); save();
    return;
  }
  var b=e.target.closest('[data-act]'); if(!b)return;
  var act=b.getAttribute('data-act'), v=b.getAttribute('data-v'), id=b.getAttribute('data-id');
  if(act==='viewall'){var c=b.getAttribute('data-cat'); if(c==='bm'){UI.folder='all';UI.q='';$q.value='';go('bookmarks');}else{UI.filter=c;UI.q='';$q.value='';go('explore');}}
  else if(act==='openfolder'){UI.folder=b.getAttribute('data-f');UI.q='';$q.value='';go('bookmarks');}
  else if(act==='filter'){UI.filter=v;render();}
  else if(act==='fav'){var i=S.favs.indexOf(id); if(i>-1)S.favs.splice(i,1);else S.favs.push(id); save(); render();}
  else if(act==='lang'){S.lang=v;save();renderChrome();render();}
  else if(act==='theme'){S.theme=v;save();renderChrome();render();}
  else if(act==='clearrecent'){S.recent=[];save();render();}
  else if(act==='resetbm'){if(UI.confirm==='reset'){S.bms=DEFAULT_BM.slice();UI.confirm=null;save();}else UI.confirm='reset';render();}
  else if(act==='addbm'){UI.form={id:null,name:'',url:'',folder:UI.folder==='all'?'other':UI.folder};UI.err='';render();focusForm();}
  else if(act==='addfromq'){UI.form={id:null,name:UI.q.trim().indexOf('.')>-1?'':UI.q.trim(),url:UI.q.trim().indexOf('.')>-1?UI.q.trim():'',folder:'other'};UI.err='';UI.q='';$q.value='';go('bookmarks');render();focusForm();}
  else if(act==='editbm'){var bm=S.bms.filter(function(x){return x.id===id;})[0]; if(bm){UI.form={id:bm.id,name:bm.name,url:bm.url,folder:bm.folder};UI.err='';render();focusForm();}}
  else if(act==='delbm'){if(UI.confirm===id){S.bms=S.bms.filter(function(x){return x.id!==id;});UI.confirm=null;save();}else UI.confirm=id;render();}
  else if(act==='cancelform'){UI.form=null;UI.err='';render();}
  else if(act==='addtool'){UI.tform={id:null,name:'',url:'',cat:'chat',act:'login'};UI.terr='';render();focusTool();}
  else if(act==='edittool'){var ct=S.custom.filter(function(x){return x.id===id;})[0]; if(ct){UI.tform={id:ct.id,name:ct.name,url:ct.url,cat:ct.cat,act:ct.act};UI.terr='';render();focusTool();}}
  else if(act==='deltool'){if(UI.confirm==='ct-'+id){S.custom=S.custom.filter(function(x){return x.id!==id;});S.favs=S.favs.filter(function(x){return x!==id;});UI.confirm=null;save();}else UI.confirm='ct-'+id;render();}
  else if(act==='canceltool'){UI.tform=null;UI.terr='';render();}
  else if(act==='toggletool'){var hi=S.hidden.indexOf(id); if(hi>-1)S.hidden.splice(hi,1);else S.hidden.push(id);save();render();}
});
function focusTool(){var f=document.getElementById('toolForm'); if(f){f.scrollIntoView({block:'center'});var n=document.getElementById('tl-name'); if(n)n.focus({preventScroll:true});}}
function submitTool(){
  var name=document.getElementById('tl-name').value.trim(), raw=document.getElementById('tl-url').value, url=normUrl(raw);
  var cat=document.getElementById('tl-cat').value, action=document.getElementById('tl-act').value;
  UI.tform.name=name;UI.tform.url=raw;UI.tform.cat=cat;UI.tform.act=action;
  if(!name){UI.terr=t('needName');render();return;}
  if(!url){UI.terr=t('badUrl');render();return;}
  if(UI.tform.id){S.custom=S.custom.map(function(c){return c.id===UI.tform.id?{id:c.id,name:name,url:url,cat:cat,act:action}:c;});}
  else S.custom.push({id:'c'+Date.now().toString(36),name:name,url:url,cat:cat,act:action});
  UI.tform=null;UI.terr='';save();render();
}
function focusForm(){var f=document.getElementById('bmForm'); if(f){f.scrollIntoView({block:'center'});var n=document.getElementById('bm-name'); if(n)n.focus({preventScroll:true});}}
document.addEventListener('submit',function(e){
  if(e.target.id==='toolForm'){e.preventDefault();submitTool();return;}
  if(e.target.id!=='bmForm')return;
  e.preventDefault();
  var name=document.getElementById('bm-name').value.trim(), url=normUrl(document.getElementById('bm-url').value), folder=document.getElementById('bm-folder').value;
  UI.form.name=name; UI.form.folder=folder; UI.form.url=document.getElementById('bm-url').value;
  if(!name){UI.err=t('needName');render();return;}
  if(!url){UI.err=t('badUrl');render();return;}
  if(UI.form.id){S.bms=S.bms.map(function(b){return b.id===UI.form.id?{id:b.id,name:name,url:url,folder:folder}:b;});}
  else S.bms.unshift({id:'b'+Date.now().toString(36),name:name,url:url,folder:folder});
  UI.form=null;UI.err='';UI.folder=folder;save();render();
});

renderChrome();
render();
})();
</script>

<script>
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0&&location.hostname!=="localhost"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
